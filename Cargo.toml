[package]
name = "wc_cuda"
version = "0.1.2"
edition = "2024"

[lib]
name = "_wc_cuda"
crate-type = ["cdylib"]

[dependencies]
windows-capture = "2.0.0-alpha.7"
pyo3 = { version = "0.23.4", features = ["extension-module", "abi3-py310"] }
thiserror = "2.0"
parking_lot = "0.12"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
